<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Photography Billing System</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            min-height:100vh;
            background:
                linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)),
                url("images/photo.png");
            background-size:cover;
            background-position:center;
            font-family: 'Poppins', sans-serif;
            color:#fff;
        }

        /* Glass Card */
        .glass{
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(14px);
            border-radius:20px;
            box-shadow:0 20px 45px rgba(0,0,0,.5);
            animation: fadeUp 1s ease;
        }

        /* Logo */
        .logo{
            height:85px;
            animation: zoomIn 1.2s ease;
        }

        /* Welcome Text */
        .welcome-text{
            font-size:24px;
            font-weight:700;
            margin-top:10px;
        }

        /* Caption */
        .caption{
            font-size:14px;
            opacity:.85;
        }

        /* Animations */
        @keyframes fadeUp{
            from{ opacity:0; transform:translateY(30px); }
            to{ opacity:1; transform:translateY(0); }
        }
        @keyframes zoomIn{
            from{ transform:scale(.6); opacity:0; }
            to{ transform:scale(1); opacity:1; }
        }

        /* Inputs */
        .form-control{
            background: rgba(255,255,255,0.9);
            border:none;
            border-radius:10px;
        }

        .btn-primary{
            border-radius:10px;
            font-weight:600;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center">

<div class="glass p-4" style="width: 580px;">

    <!-- LOGO & TITLE -->
    <div class="text-center mb-4">
        <img src="images/logo.png" class="logo mb-2" alt="LensArt Logo">
        <div class="welcome-text">
            Welcome to LensArt Studio
        </div>
        <p class="caption">
            Capturing moments • Managing memories • Simplifying billing
        </p>
    </div>

    <!-- LOGIN FORM -->
    <form action="login" method="post">
    

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control"
                   placeholder="Enter email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control"
                   placeholder="Enter password" required>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary py-2">
                Login
            </button>
        </div>
    </form>

    <!-- FOOTER -->
    <div class="text-center mt-4">
        <small class="text-light opacity-75">
            © 2026 LensArt Studio | Photography Billing System
        </small>
    </div>

</div>

</body>
</html>
